name: Fetch WOD

on:
  schedule:
    # Minuto 17 e non 0: i job al minuto 0 sono i più ritardati/scartati da GitHub
    - cron: '17 3 * * *'   # 05:17 IT (estate) — WOD del giorno
    - cron: '47 4 * * *'   # 06:47 IT — recupero se il primo salta
    - cron: '17 7 * * *'   # 09:17 IT
    - cron: '17 10 * * *'  # 12:17 IT
    - cron: '17 13 * * *'  # 15:17 IT
    - cron: '17 16 * * *'  # 18:17 IT
    - cron: '17 18 * * *'  # 20:17 IT
  workflow_dispatch: {}

jobs:
  update-wod:
    runs-on: ubuntu-latest
    # Tre tentativi di login (60s d'attesa l'uno) piu' i video: 10 minuti erano
    # al limite, 15 lasciano margine senza tenere occupato un runner a vuoto.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download hls.min.js if not present
        run: |
          if [ ! -f hls.min.js ]; then
            curl -sL "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js" -o hls.min.js
          fi

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Install ffmpeg (ricodifica video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch WOD and generate index.html + timer.html
        env:
          HYROX_EMAIL:    ${{ secrets.HYROX_EMAIL }}
          HYROX_PASSWORD: ${{ secrets.HYROX_PASSWORD }}
        run: node fetch-wod.js

      # always() e non failure(): da adesso un login mancato lascia il giro verde
      # quando il WOD di oggi e' gia' sugli schermi, e con failure() la foto di
      # quei tentativi - proprio quelli da capire - non si sarebbe piu' vista.
      # Se il login va bene il file non esiste e non viene caricato niente.
      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-login.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p videos m diagnostica
          git add -A index.html timer.html debug-exercise-fields.txt hls.min.js videos m diagnostica
          # Al primo giro dopo questa modifica stato-wod.json ancora non esiste, e
          # "git add" su un percorso che non c'e' fa fallire il passo per niente.
          if [ -f stato-wod.json ]; then git add -A stato-wod.json; fi
          git diff --cached --quiet && echo "Nessuna modifica." || \
            git commit -m "chore: WOD aggiornato $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
