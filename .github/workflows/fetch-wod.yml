name: Fetch WOD

on:
  schedule:
    # Il WOD cambia una volta al giorno e basta UN login, di notte (decisione di
    # Giuliano del 15/09/2026). Le partenze sono più d'una solo perché GitHub non
    # parte all'ora scritta: a settembre 2026 i giri partivano con 3-7 ore di
    # ritardo, o saltavano. La prima partenza che riesce fa il login e pubblica;
    # le altre trovano il WOD di oggi già sugli schermi e si chiudono senza login
    # (il controllo è all'inizio di fetch-wod.js).
    # Orari in UTC: in Italia +2 ore d'estate, +1 d'inverno. Tutti dopo la
    # mezzanotte italiana in tutte e due le stagioni.
    # Minuto 17 e non 0: i job al minuto 0 sono i più ritardati/scartati da GitHub.
    - cron: '17 0 * * *'   # 02:17 IT d'estate · 01:17 d'inverno
    - cron: '17 1 * * *'   # 03:17 · 02:17
    - cron: '17 2 * * *'   # 04:17 · 03:17
    - cron: '17 3 * * *'   # 05:17 · 04:17
    - cron: '47 4 * * *'   # 06:47 · 05:47
    - cron: '17 7 * * *'   # 09:17 · 08:17 — se il WOD manca ancora, parte l'avviso
  workflow_dispatch:
    inputs:
      prova_email:
        description: "Solo una prova dell'email di avviso: niente login, il WOD non si tocca"
        type: boolean
        default: false

# Due partenze che GitHub fa arrivare insieme non devono fare due login: la
# seconda aspetta che la prima finisca. Per questo il checkout prende main com'è
# in quel momento, e non il commit di quando GitHub ha creato il giro.
concurrency:
  group: fetch-wod
  cancel-in-progress: false

jobs:
  update-wod:
    runs-on: ubuntu-latest
    # Un tentativo di login (al massimo un minuto d'attesa) più i video.
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download hls.min.js if not present
        run: |
          if [ ! -f hls.min.js ]; then
            curl -sL "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js" -o hls.min.js
          fi

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Install ffmpeg (ricodifica video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # fetch-wod.js lascia le righe esito= e avviso= per i passi qui sotto.
      - name: Fetch WOD and generate index.html + timer.html
        id: wod
        if: ${{ !inputs.prova_email }}
        env:
          HYROX_EMAIL:    ${{ secrets.HYROX_EMAIL }}
          HYROX_PASSWORD: ${{ secrets.HYROX_PASSWORD }}
        run: node fetch-wod.js

      # always(): la foto del login mancato serve anche quando il giro resta
      # verde. Se il login va bene il file non esiste e non viene caricato niente.
      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-login.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push
        if: steps.wod.outputs.esito == 'pubblicato'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p videos m diagnostica
          git add -A index.html timer.html debug-exercise-fields.txt hls.min.js videos m diagnostica
          # Al primo giro dopo questa modifica stato-wod.json ancora non esiste, e
          # "git add" su un percorso che non c'e' fa fallire il passo per niente.
          if [ -f stato-wod.json ]; then git add -A stato-wod.json; fi
          git diff --cached --quiet && echo "Nessuna modifica." || \
            git commit -m "chore: WOD aggiornato $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      # Fino al 15/09/2026 la diagnosi si salvava solo nei giri andati bene, cioè
      # mai quando serviva. Qui si salva SOLO diagnostica/: il resto di un giro
      # fallito (video a metà) non deve arrivare sugli schermi.
      - name: Salva la diagnosi del giro fallito
        if: failure() || steps.wod.outputs.esito == 'fallito'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d diagnostica ]; then git add -A diagnostica; fi
          git diff --cached --quiet && echo "Nessuna diagnosi da salvare." || \
            git commit -m "diagnostica: giro fallito $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      # Una segnalazione sola finché il WOD non torna: se ce n'è già una aperta
      # non se ne apre un'altra. GitHub la manda per email al proprietario.
      # Le aperte si contano con l'elenco delle issue, non con «gh issue list
      # --label», che passa dalla ricerca di GitHub: la ricerca vede le issue
      # nuove in ritardo, e il 15/09/2026 la #2 si è aperta 13 minuti dopo la #1.
      - name: Avviso su GitHub
        if: always() && steps.wod.outputs.avviso == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create wod-fermo --color B60205 --force \
            --description "Gli schermi HYROX non hanno il WOD di oggi"
          aperti=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=wod-fermo&per_page=100" --jq 'length')
          if [ "$aperti" != "0" ]; then
            echo "C'è già una segnalazione aperta: non se ne apre un'altra."
            exit 0
          fi
          sito="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "@${GITHUB_REPOSITORY_OWNER} gli schermi HYROX di Mosciano non hanno il WOD di oggi."
            echo
            echo "- Diagnosi: ${sito}/blob/main/diagnostica/ultimo-errore.txt"
            echo "- Password del bot: ${sito}/settings/secrets/actions"
            echo "- Far ripartire il bot: ${sito}/actions/workflows/fetch-wod.yml, pulsante Run workflow"
            echo
            echo '```'
            cat diagnostica/ultimo-errore.txt
            echo '```'
          } > "$RUNNER_TEMP/avviso.md"
          gh issue create --label wod-fermo --body-file "$RUNNER_TEMP/avviso.md" \
            --title "Schermi HYROX: il WOD di oggi non è arrivato"

      # La segnalazione qui sopra GitHub la manda all'email dell'account
      # planetfitness-mosciano, che non legge nessuno: la #3 è rimasta aperta dal
      # 06/10 all'11/11/2026 con gli schermi fermi. Dall'11/11 l'avviso arriva
      # anche per email a Giuliano (scelta sua), UNA al giorno finché il WOD non
      # torna: dopo le 7 i giri falliti possono essere sei in un giorno, e
      # ognuno rifarebbe l'avviso. Il giorno dell'ultima email si segna con un
      # commento sulla segnalazione aperta. Indirizzo e password stanno nei
      # segreti, perché il repo è pubblico. Se l'email non parte il giro resta
      # verde (decisione del 15/09), la segnalazione c'è comunque e il giro dopo
      # riprova. Posta di servizio di planet.fit: si entra come avvisi@, si
      # manda come info@ (così SiteGround firma DKIM per planet.fit).
      - name: Avviso per email
        if: always() && (steps.wod.outputs.avviso == 'si' || inputs.prova_email)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROVA: ${{ inputs.prova_email && 'si' || 'no' }}
          SMTP_PASSWORD: ${{ secrets.AVVISO_SMTP_PASSWORD }}
          EMAIL_A: ${{ secrets.AVVISO_EMAIL_A }}
        run: |
          if [ -z "$SMTP_PASSWORD" ] || [ -z "$EMAIL_A" ]; then
            echo "::warning::Email non mandata: mancano i segreti AVVISO_SMTP_PASSWORD o AVVISO_EMAIL_A."
            exit 0
          fi
          sito="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          oggi=$(TZ=Europe/Rome date +%F)
          segno="Email di avviso mandata il ${oggi}."
          n=""
          if [ "$PROVA" = "si" ]; then
            oggetto="PROVA - Schermi HYROX: il WOD di oggi non è arrivato"
          else
            oggetto="Schermi HYROX: il WOD di oggi non è arrivato"
            # Se GitHub non risponde, l'email parte lo stesso: meglio una di troppo.
            n=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=wod-fermo&per_page=100" --jq '.[0].number // empty' || true)
            if [ -n "$n" ]; then
              commenti=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${n}/comments?per_page=100" --jq '.[].body' || true)
              if printf '%s\n' "$commenti" | grep -qxF "$segno"; then
                echo "Oggi l'email è già partita: non se ne manda un'altra."
                exit 0
              fi
            fi
          fi
          {
            echo "From: Schermi HYROX <info@planet.fit>"
            echo "To: ${EMAIL_A}"
            echo "Subject: =?UTF-8?B?$(printf '%s' "$oggetto" | base64 -w0)?="
            echo "Date: $(date -R)"
            echo "Message-ID: <fetch-wod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@planet.fit>"
            echo "MIME-Version: 1.0"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo "Content-Transfer-Encoding: 8bit"
            echo
            if [ "$PROVA" = "si" ]; then
              echo "Questa è una prova: gli schermi stanno bene. Se il WOD manca, l'email vera è come questa."
              echo
            fi
            echo "Gli schermi HYROX di Mosciano non hanno il WOD di oggi."
            echo
            if [ -n "$n" ]; then echo "- Segnalazione: ${sito}/issues/${n}"; fi
            echo "- Diagnosi: ${sito}/blob/main/diagnostica/ultimo-errore.txt"
            echo "- Password del bot: ${sito}/settings/secrets/actions"
            echo "- Far ripartire il bot: ${sito}/actions/workflows/fetch-wod.yml, pulsante Run workflow"
            echo
            echo "Finché il WOD non torna arriva un'email al giorno."
            if [ "$PROVA" != "si" ] && [ -f diagnostica/ultimo-errore.txt ]; then
              echo
              echo "--- diagnostica/ultimo-errore.txt"
              cat diagnostica/ultimo-errore.txt
            fi
          } > "$RUNNER_TEMP/email.txt"
          curl -sS --crlf --ssl-reqd --url "smtp://mail.planet.fit:587" \
            --user "avvisi@planet.fit:${SMTP_PASSWORD}" \
            --mail-from info@planet.fit --mail-rcpt "$EMAIL_A" \
            --upload-file "$RUNNER_TEMP/email.txt"
          echo "Email di avviso mandata."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$segno"; fi

      - name: Chiudi l'avviso, il WOD è tornato
        if: steps.wod.outputs.esito == 'pubblicato'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          aperti=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=wod-fermo&per_page=100" --jq '.[].number' || true)
          for n in $aperti; do
            gh issue close "$n" --comment "Risolto: il WOD di oggi è sugli schermi."
          done
